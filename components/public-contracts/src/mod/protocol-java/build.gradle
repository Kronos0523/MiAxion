plugins {
    id 'java-library'
    id 'maven-publish'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'dev.miaxion.public'
            artifactId = 'protocol-java'
            version = providers.gradleProperty('mod_version').get()
        }
    }
    repositories {
        maven {
            name = 'buildLocal'
            url = rootProject.layout.buildDirectory.dir('local-maven')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_version}"
    implementation("com.networknt:json-schema-validator:${json_schema_validator_version}") {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    compileOnly "org.slf4j:slf4j-api:${slf4j_version}"
    testRuntimeOnly "org.slf4j:slf4j-api:${slf4j_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

tasks.named('processResources') {
    from(rootProject.file('../../protocol/runtime-limits.json')) {
        into 'dev/miaxion/protocol'
    }
    from(rootProject.file('../../protocol/schema')) {
        include '*.schema.json'
        into 'dev/miaxion/protocol/schema'
    }
}

dependencies { runtimeOnly "org.slf4j:slf4j-api:${slf4j_version}" }

sourceSets { independentConsumer { java.srcDirs = ['src/independent-consumer/java'] } }
tasks.named('compileIndependentConsumerJava') {
    dependsOn 'jar'
    classpath = files(tasks.named('jar', Jar).flatMap { it.archiveFile })
}
tasks.register('verifyIndependentConsumer', JavaExec) {
    dependsOn 'compileIndependentConsumerJava'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = sourceSets.independentConsumer.output + files(tasks.named('jar', Jar).flatMap { it.archiveFile }) + configurations.runtimeClasspath
    mainClass = 'example.ProtocolConsumer'
    argumentProviders.add({ [tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath] } as CommandLineArgumentProvider)
}
