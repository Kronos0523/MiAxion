pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases'; content { includeGroupByRegex 'net\\.neoforged(?:\\..*)?' } }
    }
}
plugins { id 'net.neoforged.moddev.repositories' version '2.0.142' }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { mavenCentral() }
}
rootProject.name = 'miaxion-standing-block-example'
